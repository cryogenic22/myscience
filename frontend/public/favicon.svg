<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Market Zero — concentric pipeline rings with central node.
       Metaphor: pharma development phases as orbits, intelligence as the
       central signal that unifies them. Scales cleanly to 16x16. -->
  <rect width="64" height="64" rx="14" fill="#0A0A0B"/>
  <!-- Outer ring (Marketed / outermost phase) -->
  <circle cx="32" cy="32" r="24" stroke="#3C3C43" stroke-width="1.5" opacity="0.6"/>
  <!-- Mid ring (Phase III) -->
  <circle cx="32" cy="32" r="17" stroke="#3C3C43" stroke-width="1.5" opacity="0.55"/>
  <!-- Inner ring (Phase I/II) -->
  <circle cx="32" cy="32" r="10" stroke="#3C3C43" stroke-width="1.5" opacity="0.5"/>
  <!-- Orbital dot — a sample drug program, accent colour -->
  <circle cx="49" cy="32" r="2.5" fill="#1C6EF7"/>
  <circle cx="22" cy="44" r="2" fill="#1C6EF7" opacity="0.7"/>
  <circle cx="40" cy="18" r="1.8" fill="#1C6EF7" opacity="0.55"/>
  <!-- Central node -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="1.5" fill="#1C6EF7"/>
</svg>
