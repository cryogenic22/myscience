[phases.setup]
nixPkgs = ["python313", "nodejs_22"]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    "/opt/venv/bin/pip install --upgrade pip",
    "/opt/venv/bin/pip install -r requirements.txt",
    "cd frontend && npm ci && npm run build",
]

[start]
cmd = "/opt/venv/bin/python start.py"
