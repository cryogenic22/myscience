version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: market-zero-postgres
    environment:
      POSTGRES_DB: market_zero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5488:5432"
    volumes:
      - mz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mz_pgdata:
