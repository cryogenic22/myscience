name: Assurance Gate (WP-12 — deterministic)

# WP-12 closed-loop assurance kernel, PR-HARD and hermetic (no network, no DB).
#  - WP-12B review-artifact validator + WP-12C egress scanner mutation proofs
#  - the executable review gate (assurance/check.py --self-test) proven non-vacuous each run
#  - every committed structured review artifact reconciles against its ratified manifest
#  - protected-surface.txt <-> CODEOWNERS stay in sync
#
# Live-head reconciliation of a review artifact (reviewed_sha == the real PR head) is the
# `review-artifact-merge-gate` job below (owner-dispatched), since a self-committed artifact
# is one commit behind its own head. See specs/SPEC_WP12_assurance_kernel.md and
# .claude/rules/conservation-gates.md.

on:
  push:
    branches: [main, 'claude/handoff/**']
  pull_request:
    # Runs on PRs targeting main AND the handoff baseline chain, so this gate is not silently
    # inert on a stacked PR (e.g. #327 -> claude/handoff/h0-baseline). A security gate that
    # never triggers is a vacuous gate.
    branches: [main, 'claude/handoff/**']
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number whose assurance/reviews/PR-<n>.json to reconcile against live head"
        required: true
      require_approve:
        description: "Also require the artifact verdict == APPROVE (merge gate)"
        required: false
        default: "false"

jobs:
  assurance-kernel:
    runs-on: ubuntu-latest
    name: WP-12 assurance kernel (DB-free, hermetic)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: WP-12B validator + WP-12C scanner + assurance-gate suites (HARD)
        run: |
          python -m pytest \
            tests/test_wp12b_review_validator.py \
            tests/test_wp12c_egress_mutation.py \
            tests/test_wp12_assurance_gate.py \
            -q --no-header
      - name: Executable review gate is non-vacuous (self-test)
        # A gate that checks nothing fails closed (conservation principle #3): the self-test
        # asserts a fabricated APPROVE is rejected AND a well-formed APPROVE is accepted.
        run: python -m assurance.check --self-test
      - name: Protected-surface <-> CODEOWNERS in sync (HARD)
        run: |
          python -m pytest tests/test_protected_surface_sync.py -q --no-header

  review-artifact-merge-gate:
    # OWNER-DISPATCHED live reconciliation: validate a review artifact against the REAL PR
    # head SHA (external truth), not the artifact's self-attested value. This is the WP-12E
    # merge-gate seam the kernel cannot self-grant.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Review artifact vs live PR head
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt
      - name: Reconcile review artifact against live head
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_APPROVE: ${{ inputs.require_approve }}
        run: |
          EXTRA=""
          if [ "$REQUIRE_APPROVE" = "true" ]; then EXTRA="--require-verdict APPROVE"; fi
          python -m assurance.check \
            --artifact "assurance/reviews/PR-${{ inputs.pr }}.json" \
            --pr "${{ inputs.pr }}" \
            --repo "${{ github.repository }}" \
            $EXTRA
