# PubMed search queries
pubmed_queries:
  - '"pembrolizumab"[Title/Abstract]'
  - '"nivolumab"[Title/Abstract]'
  - '"atezolizumab"[Title/Abstract]'
  - '"durvalumab"[Title/Abstract]'
  - '"osimertinib"[Title/Abstract]'
  - '"trastuzumab deruxtecan"[Title/Abstract]'
  - '"immune checkpoint inhibitor"[Title/Abstract] AND "overall survival"[Title/Abstract]'
  - '"PD-1"[Title/Abstract] AND "clinical trial"[Title/Abstract]'
  - '"KRAS G12C"[Title/Abstract] AND "inhibitor"[Title/Abstract]'
  - '"antibody-drug conjugate"[Title/Abstract] AND "cancer"[Title/Abstract]'
  - '"PARP inhibitor"[Title/Abstract] AND ("breast cancer" OR "ovarian cancer")'
  - '"CDK4/6 inhibitor"[Title/Abstract] AND "breast cancer"[Title/Abstract]'
  - '"immunotherapy"[Title/Abstract] AND "non-small cell lung cancer"[Title/Abstract]'
  - '"systematic review"[Title] AND "immune checkpoint"[Title/Abstract]'
  - '"meta-analysis"[Publication Type] AND "pembrolizumab"[Title/Abstract]'

