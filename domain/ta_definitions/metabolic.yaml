  - '"GLP-1"[Title/Abstract] AND ("MASH" OR "NASH" OR "steatohepatitis")[Title/Abstract]'
  - '"SGLT2"[Title/Abstract] AND ("MASH" OR "NASH" OR "fatty liver")[Title/Abstract]'
  - '"semaglutide"[Title/Abstract] AND ("MASH" OR "NASH")[Title/Abstract]'
  # Cardiovascular drug-specific
  - '"sacubitril valsartan"[Title/Abstract]'
  - '"finerenone"[Title/Abstract]'
  - '"vericiguat"[Title/Abstract]'
  - '"ivabradine"[Title/Abstract]'
  - '"carvedilol"[Title/Abstract] AND "heart failure"[Title/Abstract]'
