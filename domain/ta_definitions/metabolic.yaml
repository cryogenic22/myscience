# Seed drug names — established + next-generation pipeline
target_drugs:
  # ── GLP-1 Receptor Agonists ──
  - semaglutide
  - liraglutide
  - dulaglutide
  - exenatide
  - lixisenatide
  # ── Dual/Triple Agonists (next-gen pipeline) ──
  - tirzepatide           # Eli Lilly — dual GIP/GLP-1
  - orforglipron           # Eli Lilly — oral GLP-1 (Phase 3)
  - survodutide            # Boehringer Ingelheim — dual glucagon/GLP-1
  - retatrutide            # Eli Lilly — triple GIP/GLP-1/glucagon (Phase 3)
  - pemvidutide            # Altimmune — dual glucagon/GLP-1
  - efinopegdutide         # Merck/Hanmi — dual glucagon/GLP-1
  - cotadutide             # AstraZeneca — dual glucagon/GLP-1
  - mazdutide              # Innovent — dual glucagon/GLP-1
  # ── Amylin-based ──
  - CagriSema              # Novo Nordisk — cagrilintide + semaglutide (amylin/GLP-1)
  - cagrilintide            # Novo Nordisk — amylin analog
  # ── SGLT2 Inhibitors ──
  - empagliflozin
  - dapagliflozin
  - canagliflozin
  - ertugliflozin
  # ── DPP-4 Inhibitors ──
  - sitagliptin
