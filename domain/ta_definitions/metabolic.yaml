  - '"ARNI"[Title/Abstract] AND "heart failure"[Title/Abstract]'
  - '"mineralocorticoid receptor antagonist"[Title/Abstract] AND "heart failure"[Title/Abstract]'
  # Cardiorenal-metabolic nexus
  - '"SGLT2 inhibitor"[Title/Abstract] AND "chronic kidney disease"[Title/Abstract]'
  - '"finerenone"[Title/Abstract] AND "chronic kidney disease"[Title/Abstract]'
  - '"GLP-1"[Title/Abstract] AND ("CKD" OR "chronic kidney disease")[Title/Abstract]'
  - '"cardiorenal"[Title/Abstract] AND ("GLP-1" OR "SGLT2" OR "finerenone")'
  # Phenotype-specific
  - '"heart failure"[Title/Abstract] AND "reduced ejection fraction"[Title/Abstract]'
  - '"heart failure"[Title/Abstract] AND "preserved ejection fraction"[Title/Abstract]'
  - '"obesity"[Title/Abstract] AND "GLP-1"[Title/Abstract] AND "cardiovascular"[Title/Abstract]'
